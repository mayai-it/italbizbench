[project]
name = "mayai-italbizbench"
version = "0.1.0"
description = "Benchmark for AI agents on Italian fiscal & administrative tasks — built by MayAI"
authors = [{ name = "MayAI", email = "ciao@mayai.it" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai-agents", "benchmark", "eval", "italian", "fatturazione", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[project.urls]
Homepage = "https://mayai.it"
Repository = "https://github.com/mayai-it/italbizbench"
Issues = "https://github.com/mayai-it/italbizbench/issues"

[project.scripts]
italbizbench = "italbizbench.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["italbizbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
