id: B-011-tricky-scarto-destinatario-inesistente
family: B-emissione
difficulty: tricky
title: Destinatario non in anagrafica -> scarto SDI 00200
prompt: 'Emetti la fattura a "Sconosciuto Srl": una riga "Fornitura" da 500 euro + IVA 22%. Il cliente
  non risulta in anagrafica. Il titolare, informato del possibile problema, chiede di tentare COMUNQUE
  l''invio allo SDI oggi stesso e di riportare l''esito: un eventuale scarto verra gestito dopo,
  ma serve che resti tracciato.'
initial_state:
  client: Sconosciuto Srl
  lines:
  - descrizione: Fornitura
    quantita: 1
    prezzo_unitario: 500.0
    aliquota_iva: 22.0
oracle:
  expected_regime: ordinario
  expected_imponibile: 500.0
  expected_iva: 110.0
  expected_totale: 610.0
  expected_sdi_outcome: scarto:00200
max_tool_calls: 6
