id: D-011-base-fornitore-estero
family: D-passivo
difficulty: base
title: Registrazione fattura di fornitore estero
prompt: 'Via PEC e arrivata la fattura n. CH-2026-45 di "Lambda Trading AG" (fornitore svizzero,
  P.IVA CHE123456789): 1800 euro senza IVA esposta. Registra la fattura replicando i dati del documento.'
initial_state:
  action: register_purchase
  pec_id: PEC-082
  pec_inbox:
  - id: PEC-082
    sender: lambda@pec-gateway.ch
    subject: Invoice CH-2026-45
    body: Invoice attached.
    invoice:
      fornitore: Lambda Trading AG
      piva: CHE123456789
      numero: CH-2026-45
      imponibile: 1800.0
      iva: 0.0
      totale: 1800.0
      righe:
      - descrizione: Componenti elettronici
        importo: 1800.0
        aliquota_iva: 0.0
oracle:
  expected_purchase:
    fornitore: Lambda Trading AG
    piva: CHE123456789
    numero: CH-2026-45
    imponibile: 1800.0
    iva: 0.0
    totale: 1800.0
max_tool_calls: 8
