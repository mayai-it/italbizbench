id: F-014-tricky-reverse-e-incasso-split
family: F-orchestrazione
difficulty: tricky
title: Emetti in reverse charge e riconcilia un incasso split payment
prompt: 'Due attivita: (1) emetti fattura a "Rossi Costruzioni Srl" per subappalto edile di 5000
  euro in REVERSE CHARGE (IVA a carico del committente, niente bollo); (2) riconcilia l''incasso
  di 2000 euro dal "Comune di Esempio" con causale "FT-2026-0214": la fattura e in split payment,
  la PA paga il solo imponibile.'
initial_state:
  issued_invoices:
  - client: Comune di Esempio
    imponibile: 2000.0
    iva: 440.0
    totale: 2000.0
    regime: split_payment
    bollo: 0.0
    sdi_outcome: accettata
    numero: FT-2026-0214
    paid: false
  transactions:
  - id: TX-212
    data: '2026-07-24'
    importo: 2000.0
    controparte: Comune di Esempio
    causale: FT-2026-0214
  steps:
  - action: emit_invoice
    client: Rossi Costruzioni Srl
    lines:
    - descrizione: Subappalto opere edili
      quantita: 1.0
      prezzo_unitario: 5000.0
      aliquota_iva: 0.0
      natura: N6
    reverse_charge: true
  - action: reconcile
    matches:
    - tx_id: TX-212
      numero: FT-2026-0214
oracle:
  expected_regime: reverse_charge
  expected_imponibile: 5000.0
  expected_iva: 0.0
  expected_totale: 5000.0
  expected_sdi_outcome: accettata
  expected_reconciliations:
  - tx_id: TX-212
    numero: FT-2026-0214
max_tool_calls: 10
expected_tool_calls: 6
