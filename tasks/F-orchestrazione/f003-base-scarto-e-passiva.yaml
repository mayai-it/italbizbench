id: F-003-base-scarto-e-passiva
family: F-orchestrazione
difficulty: base
title: Correggi uno scarto SDI e registra una fattura passiva
prompt: 'Due attivita: (1) la fattura a "Verdi Snc" (500 euro + IVA 22%) e stata scartata (00312):
  il codice destinatario "ABC" e invalido, quello corretto e "VRD1234" — correggi l''anagrafica e
  ritrasmetti; (2) registra la fattura passiva n. 2026/730 di "Beta Cancelleria Snc" (350 euro +
  IVA 22%) arrivata via PEC.'
initial_state:
  extra_clients:
    Verdi Snc:
      piva: '99900011125'
      codice_destinatario: ABC
      pa: false
  issued_invoices:
  - client: Verdi Snc
    imponibile: 500.0
    iva: 110.0
    totale: 610.0
    regime: ordinario
    bollo: 0.0
    sdi_outcome: scarto:00312
  pec_inbox:
  - id: PEC-202
    sender: beta@pec.it
    subject: Fattura 2026/730
    body: In allegato.
    invoice:
      fornitore: Beta Cancelleria Snc
      piva: '55500022235'
      numero: 2026/730
      imponibile: 350.0
      iva: 77.0
      totale: 427.0
  steps:
  - action: fix_and_resend
    client: Verdi Snc
    fix:
      codice_destinatario: VRD1234
    lines:
    - descrizione: Fornitura materiali
      quantita: 1.0
      prezzo_unitario: 500.0
      aliquota_iva: 22.0
  - action: register_purchase
    pec_id: PEC-202
oracle:
  expected_client_update:
    client: Verdi Snc
    codice_destinatario: VRD1234
  expected_regime: ordinario
  expected_imponibile: 500.0
  expected_iva: 110.0
  expected_totale: 610.0
  expected_sdi_outcome: accettata
  expected_purchase:
    fornitore: Beta Cancelleria Snc
    piva: '55500022235'
    numero: 2026/730
    imponibile: 350.0
    iva: 77.0
    totale: 427.0
max_tool_calls: 10
expected_tool_calls: 6
